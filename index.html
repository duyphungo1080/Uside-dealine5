<!DOCTYPE html>
<html>
    <head>
        <title>Layout Website</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <div class="menu">
                <ul>
                    <li class="picked"><img src="vuesax/linear/element-4.svg" class="icon" ></li>
                    <li><img src="vuesax/linear/graph.svg" class="icon"></li>
                    <li><img src="vuesax/linear/medal-star.svg" class="icon"></li>
                    <li><img src="vuesax/linear/messages.svg" class="icon"></li>
                    <li><img src="vuesax/linear/setting-2.svg" class="icon"></li>
                </ul>
            </div>
        </nav>

        <main>
            <section class="header">

                <div class="left">
                    <p class="up"> Welcome, Amada</p>
                    <p class="low">Tue, 07 June, 2022</p>
                </div>

                <div class="right">
                    <p class="search"><img src="vuesax/linear/search-normal.svg" class="icon"><input type="search" placeholder="Search"></p>
                    <div class="noti"><img src="vuesax/linear/notification-bing.svg" class="icon"></div>
                    <img src="vuesax/Rectangle 1072.svg" class="avt">
                </div>

            </section>
            <section class="main">
                <img src="vuesax/Rectangle 6691.png">

                <div class="content">
                    <div class="h-content">
                        <img src="vuesax/Ellipse 11.svg" class="avtmain">
                        <hgroup class="name">
                            <p class="nmain">Alexa Rawles</p>
                            <p class="mail">alexarawles@gmail.com</p>
                        </hgroup>
                        <button>Edit</button>
                    </div>
                </div>


                <form>
                    <div class="form-grp">
                        <label for="fullname">Full Name</label>
                        <input type="text" placeholder="Your First Name" id="fullname" class="input">
                    </div>
                    <div class="form-grp">
                        <label for="nickname">Nick Name</label>
                        <input type="text" placeholder="Your Nick Name" id="nickname" class="input">
                    </div>
                    <div class="form-grp">
                        <label for="gender">Gender</label>
                        <select id="gender" class="input">
                            <option>Your Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="form-grp">
                        <label for="country">Country</label>
                        <select id="country" class="input">
                            <option>Your Country</option>
                            <option>Vì Cá Ngừ</option>
                            <option>Fortuna</option>
                            <option>Bán sếp Nhân</option>
                        </select>
                    </div>
                    <div class="form-grp">
                        <label for="lang">Language</label>
                        <select id="lang" class="input">
                            <option>Your Language</option>
                            <option>Tiếng Việt</option>
                            <option>Vietnamese</option>
                        </select>
                    </div>
                    <div class="form-grp">
                        <label for="time-zone">Time Zone</label>
                        <select id="time-zone" class="input">
                            <option>Your Time Zone</option>
                        </select>
                    </div>
                </form>
                    <div class="email">
                        <p class="up">My email Address</p>
                        <hgroup class="ic-mail">
                            <div class="ic-img"><img src="vuesax/bold/sms.svg" class="icon" > </div>
                            
                            <div>
                                <p class="up">alexarawles@gmail.com</p>
                                <p class="mail">1 month ago</p>
                            </div>
                        </hgroup>
                        <button>+Add Email Address</button>
                    </div>
            </section>
            
        </main>
    </body>
</html>
